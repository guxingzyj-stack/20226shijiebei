services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldcup}
      POSTGRES_USER: ${POSTGRES_USER:-worldcup_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  crawler:
    build:
      context: ./crawler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}

  model-worker:
    build:
      context: .
      dockerfile: model/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
      MODEL_WORKER_ENABLED: ${MODEL_WORKER_ENABLED:-true}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
    command: >
      sh -lc 'if [ "$${MODEL_WORKER_ENABLED}" = "false" ]; then
        echo "model-worker disabled; sleeping";
        sleep infinity;
      else
        python -m model.model_worker;
      fi'

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BETTING_ENABLED: ${BETTING_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
    ports:
      - "8000:8000"
    command: >
      sh -lc "python -m api.apply_migrations &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_BETTING_ENABLED: ${VITE_BETTING_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
